name: Materialize PhysX Fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'ci/linux-build-probe' || github.ref_name == 'ci/linux-build-probe'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: ci/linux-build-probe
          fetch-depth: 0

      - name: Materialize validated PhysX source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/apply_physx_static_consumer.py
          rm ci/apply_physx_static_consumer.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/linux-build-probe.yml')
          text = path.read_text(encoding='utf-8')
          block = '''          if test -f ci/apply_physx_static_consumer.py; then
            python3 ci/apply_physx_static_consumer.py
            rm ci/apply_physx_static_consumer.py
          fi
'''
          if block not in text:
              raise RuntimeError('Temporary PhysX apply block was not found.')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
          rm .github/workflows/materialize-physx-fix.yml

      - name: Commit permanent source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materialize validated PhysX initialization order"
          git push origin HEAD:ci/linux-build-probe
