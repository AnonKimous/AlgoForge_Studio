name: Apply Dependency Bootstrap And PhysX Portability

on:
  push:
    branches:
      - ci/linux-build-probe

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci/linux-build-probe
          fetch-depth: 0

      - name: Apply source edits
        run: python3 ci/apply_dependency_bootstrap_and_physx.py

      - name: Commit edits
        run: |
          rm ci/apply_dependency_bootstrap_and_physx.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: bootstrap CUDA and PhysX dependencies"
          git push origin HEAD:ci/linux-build-probe
