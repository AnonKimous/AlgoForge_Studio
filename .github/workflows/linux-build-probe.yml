name: Apply Cross-Platform Packaging Patch

on:
  push:
    branches:
      - ci/linux-build-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-22.04
    env:
      PATCH_B64: 
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ci/linux-build-probe
          fetch-depth: 0

      - name: Apply source patch once
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          patch = gzip.decompress(base64.b64decode(os.environ["PATCH_B64"]))
          Path("/tmp/cross-platform-package.patch").write_bytes(patch)
          PY

          if git apply --check /tmp/cross-platform-package.patch; then
            git apply /tmp/cross-platform-package.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "build: add platform-neutral algorithm package artifacts"
            git push origin HEAD:ci/linux-build-probe
          else
            echo "Patch is already applied or no longer matches; leaving the branch unchanged."
          fi
