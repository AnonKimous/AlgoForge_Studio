name: Linux Build And Teapot Acceptance

on:
  push:
    branches:
      - ci/linux-build-probe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-render-teapot:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build and headless Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            python3-pip \
            pkg-config \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            glslang-tools \
            xvfb \
            xauth \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxfixes-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libudev-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libdecor-0-dev \
            liburing-dev \
            libfribidi-dev \
            libibus-1.0-dev \
            libthai-dev \
            libusb-1.0-0-dev

      - name: Provide glslc-compatible command
        run: |
          sudo tee /usr/local/bin/glslc >/dev/null <<'SH'
          #!/usr/bin/env bash
          exec glslangValidator -V "$@"
          SH
          sudo chmod +x /usr/local/bin/glslc

      - name: Install Python requirements
        run: python3 -m pip install -r requirements.txt

      - name: Record tool versions
        run: |
          mkdir -p testData/ci
          {
            uname -a
            clang --version
            clang++ --version
            cmake --version
            ninja --version
            python3 --version
            glslangValidator --version
            vulkaninfo --summary || true
          } | tee testData/ci/tool-versions.log

      - name: Build mainline and teapot algorithm package
        shell: bash
        run: |
          set -o pipefail
          python3 boot/booterNinjaClang.py v4a10_teapot_pbr_demo \
            2>&1 | tee testData/ci/linux-build.log

      - name: Run teapot algorithm and export GIF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testData/ci

          DEBUG_TOOL="build/OpenSource/RelWithDebInfo/debugTool"
          test -x "$DEBUG_TOOL"

          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | head -n 1)"
          test -n "$LVP_ICD"
          export VK_ICD_FILENAMES="$LVP_ICD"

          Xvfb :99 -screen 0 1280x720x24 >testData/ci/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          sleep 2

          "$DEBUG_TOOL" \
            --runner-server \
            --runner-server-once \
            --runner-endpoint 127.0.0.1:0 \
            >testData/ci/runner-server.log 2>&1 &
          SERVER_PID=$!

          for _ in $(seq 1 100); do
            if test -s testData/runner_control/endpoint.txt; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat testData/ci/runner-server.log
              exit 1
            fi
            sleep 0.1
          done
          test -s testData/runner_control/endpoint.txt

          set +e
          "$DEBUG_TOOL" \
            --algorithm-runner \
            --algorithm v4a10_teapot_pbr_demo \
            --ticks 48 \
            --execution vk \
            --preview-width 640 \
            --preview-height 480 \
            --preview-output testData/ci/teapot.png \
            --preview-gif testData/ci/teapot.gif \
            --gif-duration 4 \
            --runner-endpoint 127.0.0.1:0 \
            2>&1 | tee testData/ci/teapot-runner.log
          RUNNER_STATUS=${PIPESTATUS[0]}
          set -e

          wait "$SERVER_PID" || true
          cat testData/ci/runner-server.log
          test "$RUNNER_STATUS" -eq 0
          grep -q "OK algorithm_runner" testData/ci/teapot-runner.log
          test -s testData/ci/teapot.png
          test -s testData/ci/teapot.gif

          LAST_RUN="testData/norm/debugInfo/last_run.log"
          test -s "$LAST_RUN"
          cp "$LAST_RUN" testData/ci/teapot-last-run.log
          grep -Eq "preview_pixels=[1-9][0-9]*" "$LAST_RUN"

      - name: Record generated files
        if: always()
        run: |
          mkdir -p testData/ci
          find build/OpenSource sdk algorithmLib/algorithmruntimeLib testData \
            -maxdepth 8 -type f -printf '%p\n' 2>/dev/null \
            | sort > testData/ci/generated-files.txt || true

      - name: Upload logs and teapot acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algoforge-linux-teapot-acceptance
          path: |
            testData/ci
            testData/norm/debugInfo
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Linux build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: algoforge-linux-package
          path: |
            build/OpenSource/RelWithDebInfo/debugTool
            sdk/cpp
            algorithmLib/algorithmruntimeLib
          if-no-files-found: error
          retention-days: 7
