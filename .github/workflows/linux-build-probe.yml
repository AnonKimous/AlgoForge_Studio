name: Linux Build Probe

on:
  push:
    branches:
      - ci/linux-build-probe
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mainline-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            python3-pip \
            pkg-config \
            libvulkan-dev \
            vulkan-tools \
            glslang-tools \
            glslc \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxfixes-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libudev-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libdecor-0-dev \
            liburing-dev \
            libfribidi-dev \
            libibus-1.0-dev \
            libthai-dev \
            libusb-1.0-0-dev

      - name: Install Python requirements
        run: python3 -m pip install -r requirements.txt

      - name: Record tool versions
        run: |
          mkdir -p testData/ci
          {
            uname -a
            clang --version
            clang++ --version
            cmake --version
            ninja --version
            python3 --version
            glslc --version
            vulkaninfo --summary || true
          } | tee testData/ci/tool-versions.log

      - name: Build mainline and one algorithm package
        shell: bash
        run: |
          set -o pipefail
          python3 boot/booterNinjaClang.py compatibility_probe \
            2>&1 | tee testData/ci/linux-build.log

      - name: Record generated files
        if: always()
        run: |
          mkdir -p testData/ci
          find build/OpenSource sdk algorithmLib/algorithmruntimeLib \
            -maxdepth 6 -type f -printf '%p\n' 2>/dev/null \
            | sort > testData/ci/generated-files.txt || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algoforge-linux-build-probe
          path: testData/ci
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Linux package output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: algoforge-linux-package
          path: |
            build/OpenSource/RelWithDebInfo/debugTool
            sdk/cpp
            algorithmLib/algorithmruntimeLib
          if-no-files-found: error
          retention-days: 7
