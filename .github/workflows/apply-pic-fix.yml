name: Apply Algorithm Plugin PIC Fix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/linux-build-probe
          fetch-depth: 0

      - name: Apply source fix
        run: python3 ci/apply_pic_fix.py

      - name: Commit source fix
        run: |
          rm ci/apply_pic_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: compile algorithm support library as PIC"
          git push origin HEAD:ci/linux-build-probe
