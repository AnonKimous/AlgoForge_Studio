name: Apply Staged Portability Changes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/linux-build-probe
          fetch-depth: 0

      - name: Apply staged changes with full diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testData/ci
          python3 ci/fix_staged_patch_loader_match.py \
            >testData/ci/portability-patch.log 2>&1
          python3 ci/apply_dependency_bootstrap_and_physx.py \
            >>testData/ci/portability-patch.log 2>&1
          python3 ci/apply_physx_static_consumer.py \
            >>testData/ci/portability-patch.log 2>&1
          cat testData/ci/portability-patch.log

      - name: Commit staged source changes
        shell: bash
        run: |
          set -euo pipefail
          rm ci/fix_staged_patch_loader_match.py
          rm ci/apply_dependency_bootstrap_and_physx.py
          rm ci/apply_physx_static_consumer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!testData'
          git commit -m "build: bootstrap portable CUDA and PhysX packages"
          git push origin HEAD:ci/linux-build-probe

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-patch-diagnostics
          path: testData/ci/portability-patch.log
          if-no-files-found: warn
          retention-days: 7
