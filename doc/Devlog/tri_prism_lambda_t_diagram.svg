<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2367c9"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#008c95"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="#f7f9fc"/>
  <text x="60" y="62" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#17212f">广义三棱柱：t 和 λ 到底在哪里</text>
  <text x="60" y="102" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19" fill="#526173">t 选择“哪一个截面”；λ1、λ2、λ3 选择“截面三角形里的哪个位置”</text>

  <!-- Prism side faces -->
  <polygon points="120,535 410,585 570,230 275,185" fill="#bfd5f4" fill-opacity="0.72" stroke="#2367c9" stroke-width="3"/>
  <polygon points="410,585 235,425 370,75 570,230" fill="#d8c4f2" fill-opacity="0.70" stroke="#7040a5" stroke-width="3"/>
  <polygon points="235,425 120,535 275,185 370,75" fill="#c9eadf" fill-opacity="0.72" stroke="#25866c" stroke-width="3"/>

  <!-- Corresponding generator edges -->
  <line x1="120" y1="535" x2="275" y2="185" stroke="#008c95" stroke-width="4" stroke-dasharray="12 9"/>
  <line x1="410" y1="585" x2="570" y2="230" stroke="#008c95" stroke-width="4" stroke-dasharray="12 9"/>
  <line x1="235" y1="425" x2="370" y2="75" stroke="#008c95" stroke-width="4" stroke-dasharray="12 9"/>

  <!-- End triangles -->
  <polygon points="120,535 410,585 235,425" fill="#2367c9" fill-opacity="0.22" stroke="#2367c9" stroke-width="5"/>
  <polygon points="275,185 570,230 370,75" fill="#7040a5" fill-opacity="0.25" stroke="#7040a5" stroke-width="5"/>

  <!-- t=2/5 section -->
  <polygon points="182,395 474,443 289,285" fill="#f6a623" fill-opacity="0.40" stroke="#e67e22" stroke-width="6" filter="url(#shadow)"/>
  <line x1="182" y1="395" x2="474" y2="443" stroke="#e67e22" stroke-width="3" stroke-dasharray="7 7"/>
  <line x1="474" y1="443" x2="289" y2="285" stroke="#e67e22" stroke-width="3" stroke-dasharray="7 7"/>
  <line x1="289" y1="285" x2="182" y2="395" stroke="#e67e22" stroke-width="3" stroke-dasharray="7 7"/>

  <!-- Finite contact patch and lambda arrows -->
  <ellipse cx="315" cy="374" rx="44" ry="28" fill="#e74c3c" fill-opacity="0.20" stroke="#d93232" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="350" y="335" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#b32121">有限载荷区 ΓL</text>
  <circle cx="315" cy="374" r="12" fill="#d93232" stroke="#ffffff" stroke-width="4"/>
  <text x="332" y="368" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#b32121">P 压强分布中心</text>
  <line x1="315" y1="374" x2="182" y2="395" stroke="#e67e22" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <line x1="315" y1="374" x2="474" y2="443" stroke="#e67e22" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <line x1="315" y1="374" x2="289" y2="285" stroke="#e67e22" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <text x="205" y="365" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#b85c00">λ1</text>
  <text x="407" y="393" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#b85c00">λ2</text>
  <text x="305" y="323" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#b85c00">λ3</text>

  <!-- t markers -->
  <circle cx="182" cy="395" r="8" fill="#008c95" stroke="#ffffff" stroke-width="3"/>
  <circle cx="474" cy="443" r="8" fill="#008c95" stroke="#ffffff" stroke-width="3"/>
  <circle cx="289" cy="285" r="8" fill="#008c95" stroke="#ffffff" stroke-width="3"/>
  <text x="95" y="370" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#00727a">同一个 t = 2/5 截面</text>
  <line x1="150" y1="382" x2="176" y2="393" stroke="#008c95" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <!-- Vertex labels -->
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="700">
    <text x="93" y="566" fill="#164f9e">A</text>
    <text x="420" y="620" fill="#164f9e">B</text>
    <text x="205" y="423" fill="#164f9e">C</text>
    <text x="263" y="165" fill="#5b2d8d">A'</text>
    <text x="580" y="236" fill="#5b2d8d">B'</text>
    <text x="374" y="66" fill="#5b2d8d">C'</text>
    <text x="162" y="425" fill="#b85c00">At</text>
    <text x="486" y="468" fill="#b85c00">Bt</text>
    <text x="296" y="276" fill="#b85c00">Ct</text>
  </g>

  <!-- Right explanation cards -->
  <rect x="700" y="150" width="630" height="245" rx="18" fill="#ffffff" stroke="#008c95" stroke-width="3" filter="url(#shadow)"/>
  <text x="735" y="195" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#00727a">① t 是怎么来的</text>
  <text x="735" y="238" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#17212f">At = (1-t)A + tA'</text>
  <text x="735" y="274" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#17212f">Bt = (1-t)B + tB'</text>
  <text x="735" y="310" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#17212f">Ct = (1-t)C + tC'</text>
  <text x="735" y="356" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#526173">固定 t，三个插值点组成一个截面三角形。</text>

  <rect x="700" y="430" width="630" height="260" rx="18" fill="#ffffff" stroke="#e67e22" stroke-width="3" filter="url(#shadow)"/>
  <text x="735" y="475" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#b85c00">② λ 是怎么来的</text>
  <text x="735" y="520" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#17212f">P = λ1 At + λ2 Bt + λ3 Ct</text>
  <text x="735" y="558" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="22" fill="#17212f">λ1 + λ2 + λ3 = 1</text>
  <text x="735" y="606" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#526173">λ1、λ2、λ3 只表示 P 在橙色截面三角形内的位置。</text>
  <text x="735" y="642" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#526173">中心点时：λ1 = λ2 = λ3 = 1/3。</text>

  <text x="60" y="770" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#526173">蓝色：底端三角形　紫色：顶端三角形　橙色：t=2/5 截面　红色虚线：有限载荷区 ΓL</text>
</svg>
